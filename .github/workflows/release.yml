name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and signing configuration
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
          node -e 'const fs=require("node:fs");const config=JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json"));const pkg=JSON.parse(fs.readFileSync("apps/desktop/package.json"));const cargo=fs.readFileSync("apps/desktop/src-tauri/Cargo.toml","utf8").match(/^version = "([^"]+)"/m)[1];if(process.env.GITHUB_REF_NAME!=="v"+config.version||pkg.version!==config.version||cargo!==config.version)throw Error("Tag and desktop versions must match");'
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Published releases are immutable. Increase the version.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "EfficiencyMemo $GITHUB_REF_NAME" --generate-notes
          fi
          id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libx11-dev libxss-dev
      - name: Build and upload signed installers and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --ci
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/updater-check"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$RUNNER_TEMP/updater-check"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/updater-assets.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'updater-check', 'latest.json'), 'utf8'));
          const { assets } = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'updater-assets.json'), 'utf8'));
          const downloadPrefixes = [
            'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/' + process.env.GITHUB_REF_NAME + '/',
            'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/latest/download/',
          ];
          if (manifest.version?.replace(/^v/, '') !== process.env.GITHUB_REF_NAME.replace(/^v/, '')) throw Error('Updater version must match release tag');
          for (const os of ['windows', 'linux', 'darwin']) {
            const entries = Object.entries(manifest.platforms ?? {}).filter(([target]) => target.startsWith(os + '-'));
            if (!entries.length) throw Error('Missing updater platform: ' + os);
            for (const [target, update] of entries) {
              const downloadPrefix = typeof update.url === 'string' && downloadPrefixes.find((prefix) => update.url.startsWith(prefix));
              if (!downloadPrefix) throw Error('Invalid updater URL: ' + target);
              const name = decodeURIComponent(update.url.slice(downloadPrefix.length));
              const bundle = assets.find((asset) => asset.name === name);
              const signature = assets.find((asset) => asset.name === bundle?.name + '.sig');
              if (!bundle || bundle.state !== 'uploaded' || !bundle.size || !signature || signature.state !== 'uploaded' || !signature.size || typeof update.signature !== 'string' || !update.signature.trim()) {
                throw Error('Missing signed updater assets: ' + target);
              }
              const signatureText = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'updater-check', signature.name), 'utf8').trim();
              if (signatureText !== update.signature.trim()) throw Error('Updater signature does not match asset: ' + target);
            }
          }
          console.log('Updater manifest and signed assets validated for Windows, Linux and macOS');
          NODE
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
