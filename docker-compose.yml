name: efficiency-memo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init:
    image: postgres:17-alpine
    depends_on:
      auth:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase:/supabase:ro
      - ./scripts/init-supabase.sh:/usr/local/bin/init-supabase.sh:ro
    entrypoint: ["bash", "/usr/local/bin/init-supabase.sh"]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_SITE_URL: ${SUPABASE_AUTH_SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@efficiency-memo.local
      GOTRUE_SMTP_SENDER_NAME: noreply
      GOTRUE_DISABLE_SIGNUP: "false"
      API_EXTERNAL_URL: http://localhost:54321
      PORT: "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.0
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped

  studio:
    image: supabase/studio:2026.06.03-sha-0bca601
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      STUDIO_PG_META_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      HOSTNAME: "0.0.0.0"
    ports:
      - "54323:3000"
    restart: unless-stopped

  inbucket:
    image: inbucket/inbucket:3.0.4
    ports:
      - "54324:9000"
      - "54325:2500"
    restart: unless-stopped

  kong:
    image: nginx:alpine
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "54321:80"
    volumes:
      - ./scripts/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://auth:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./scripts/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  schema-bootstrap:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/postgres-init:/init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PGPASSWORD=$POSTGRES_PASSWORD psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth;" && \
        PGPASSWORD=$POSTGRES_PASSWORD psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN CREATE ROLE supabase_auth_admin WITH LOGIN CREATEROLE PASSWORD '$POSTGRES_PASSWORD'; END IF; END \$\$; ALTER ROLE supabase_auth_admin SET search_path = 'auth'; GRANT ALL PRIVILEGES ON SCHEMA auth TO supabase_auth_admin; GRANT CREATE ON DATABASE postgres TO supabase_auth_admin;"
    restart: "no"

volumes:
  pgdata:
