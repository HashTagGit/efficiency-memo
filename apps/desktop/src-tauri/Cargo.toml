[package]
name = "efficiency-memo"
version = "0.1.0"
description = "EfficiencyMemo Desktop - A unified tool gallery for daily productivity"
authors = ["JunYe Lin <junyelin2000@163.com>"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "efficiency_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest_dav = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
keyring = { version = "3", features = ["async-secret-service", "apple-native", "windows-native"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
