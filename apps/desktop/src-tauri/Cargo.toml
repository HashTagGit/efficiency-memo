[package]
name = "efficiency-memo"
version = "0.0.1"
description = "EfficiencyMemo Desktop - A unified tool gallery for daily productivity"
authors = ["You"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "efficiency_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
